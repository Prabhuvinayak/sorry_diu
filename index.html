<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorry Diuu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }


        .opening {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b8b
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 9999;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }

        .opening.hide {
            opacity: 0;
            visibility: hidden;
        }

        .opening-heart {
            font-size: 100px;

            animation:
                heartbeat 1.2s infinite;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255, 255, 255, 0.7)
                );
        }

        .opening h1 {
            margin-top: 25px;

            font-size: 38px;

            text-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.7);
        }

        .opening p {
            margin-top: 15px;

            font-size: 18px;
        }

        .open-btn {
            margin-top: 35px;

            padding: 16px 35px;

            border: none;

            border-radius: 40px;

            background: white;

            color: #ff4f81;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.25);

            animation:
                buttonPulse 1.5s infinite;
        }

        .open-btn:hover {
            transform: scale(1.08);
        }


        .container {
            width: 90%;

            max-width: 420px;

            text-align: center;

            position: relative;

            z-index: 10;

            opacity: 0;

            transform: translateY(30px);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;
        }

        .container.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =========================================
           HEART
        ========================================= */

        .heart {
            font-size: 90px;

            animation:
                heartbeat 1.2s infinite;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255, 255, 255, 0.6)
                );
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.15);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }



        h1 {
            font-size: 45px;

            margin-top: 15px;

            text-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.7);
        }


        .subtitle {
            margin-top: 15px;

            font-size: 20px;

            line-height: 1.6;
        }


        .buttons {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;
        }

        button {
            border: none;

            padding: 14px 28px;

            border-radius: 30px;

            font-size: 17px;

            cursor: pointer;

            transition:
                0.3s ease;
        }

        #yesBtn {
            background: white;

            color: #ff4f81;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.2);
        }

        #yesBtn:hover {
            transform:
                scale(1.1);
        }

        #noBtn {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            color: white;
        }


        .message {
            margin-top: 25px;

            font-size: 22px;

            font-weight: bold;

            min-height: 35px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.15);
        }



        .floating-heart {
            position: absolute;

            bottom: -50px;

            font-size: 25px;

            animation:
                floatUp linear forwards;

            pointer-events: none;

            z-index: 50;
        }

        @keyframes floatUp {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            to {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }



        .celebrate {
            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            width: 85%;

            max-width: 380px;

            padding: 35px 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            color: #ff4f81;

            border-radius: 25px;

            display: none;

            z-index: 1000;

            text-align: center;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.3);

            backdrop-filter:
                blur(10px);
        }

        .celebrate.show {
            display: block;

            animation:
                celebrationPop
                0.6s ease
                forwards;
        }

        .celebrate-heart {
            font-size: 65px;

            display: block;

            margin-bottom: 10px;

            animation:
                celebrationHeart
                1s infinite;
        }

        .thank-you {
            font-size: 32px;

            font-weight: bold;

            line-height: 1.2;
        }

        .forgiven-text {
            margin-top: 15px;

            font-size: 20px;

            font-weight: bold;

            line-height: 1.5;
        }

        @keyframes celebrationPop {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0);

                opacity: 0;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    scale(1.08);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: 1;
            }
        }

        @keyframes celebrationHeart {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }


        .music-btn {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 50px;
            height: 50px;

            padding: 0;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            color: white;

            font-size: 22px;

            z-index: 200;

            backdrop-filter:
                blur(10px);
        }

        .music-btn.playing {
            animation:
                musicPulse 1s infinite;
        }

        @keyframes musicPulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }


        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }



        @media (max-width: 500px) {

            .opening-heart {
                font-size: 80px;
            }

            .opening h1 {
                font-size: 30px;
            }

            .opening p {
                font-size: 16px;
            }

            .heart {
                font-size: 75px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 18px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                padding: 12px 22px;

                font-size: 16px;
            }

            .message {
                font-size: 19px;
            }

            .thank-you {
                font-size: 28px;
            }

            .forgiven-text {
                font-size: 18px;
            }

            .celebrate {
                padding: 30px 20px;
            }
        }

    </style>

</head>


<body>



    <audio id="bgMusic" loop>

        <source
            src="song.mp3"
            type="audio/mpeg"
        >

        Your browser does not support audio.

    </audio>




    <div
        class="opening"
        id="opening"
    >

        <div class="opening-heart">
            ❤️
        </div>

        <h1>
            Hey Diuu... 🥺
        </h1>

        <p>
            I have something to tell you...
        </p>

        <button
            class="open-btn"
            id="openBtn"
        >
            Tap to Open ❤️
        </button>

    </div>



    <button
        class="music-btn"
        id="musicBtn"
    >
        🎵
    </button>


    <div
        class="container"
        id="mainContent"
    >

        <div class="heart">
            ❤️
        </div>


        <h1>
            Sorry Diuu 🥺
        </h1>


        <p class="subtitle">

            I know I made a mistake...

            <br>

            But please don't stay angry with me. ❤️

            <br><br>

            You mean a lot to me. 🫶

        </p>


        <div class="buttons">

            <button id="yesBtn">
                Forgive Me ❤️
            </button>

            <button id="noBtn">
                Still Angry 😤
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>

    </div>




    <div
        class="celebrate"
        id="celebrate"
    >

        <span class="celebrate-heart">
            ❤️🥰❤️
        </span>


        <div class="thank-you">
            Thank You Diuu! ❤️
        </div>


        <div class="forgiven-text">

            I knew you would forgive me 🥺💕

            <br>

            You just made my day! 🫶

        </div>

    </div>



    <script>

        const opening =
            document.getElementById(
                "opening"
            );

        const openBtn =
            document.getElementById(
                "openBtn"
            );

        const mainContent =
            document.getElementById(
                "mainContent"
            );

        const bgMusic =
            document.getElementById(
                "bgMusic"
            );

        const musicBtn =
            document.getElementById(
                "musicBtn"
            );

        const yesBtn =
            document.getElementById(
                "yesBtn"
            );

        const noBtn =
            document.getElementById(
                "noBtn"
            );

        const message =
            document.getElementById(
                "message"
            );

        const celebrate =
            document.getElementById(
                "celebrate"
            );


        let musicPlaying = false;



        openBtn.addEventListener(
            "click",
            () => {

                bgMusic
                    .play()
                    .then(() => {

                        musicPlaying = true;

                        musicBtn.classList.add(
                            "playing"
                        );

                        musicBtn.innerHTML =
                            "🎵";

                    })
                    .catch(
                        error => {

                            console.log(
                                "Music error:",
                                error
                            );

                        }
                    );


                opening.classList.add(
                    "hide"
                );


                setTimeout(() => {

                    mainContent.classList.add(
                        "show"
                    );

                }, 500);


                /* Initial hearts */

                for (
                    let i = 0;
                    i < 15;
                    i++
                ) {

                    setTimeout(
                        () => {

                            createHeart();

                        },
                        i * 150
                    );

                }

            }
        );




        musicBtn.addEventListener(
            "click",
            () => {

                if (musicPlaying) {

                    bgMusic.pause();

                    musicPlaying = false;

                    musicBtn.classList.remove(
                        "playing"
                    );

                    musicBtn.innerHTML =
                        "🔇";

                } else {

                    bgMusic
                        .play()
                        .then(() => {

                            musicPlaying = true;

                            musicBtn.classList.add(
                                "playing"
                            );

                            musicBtn.innerHTML =
                                "🎵";

                        });

                }

            }
        );



        yesBtn.addEventListener(
            "click",
            () => {

                message.innerHTML =
                    "Yayyy! I knew you would forgive me 🥺❤️";


                celebrate.classList.add(
                    "show"
                );


                /* Celebration hearts */

                for (
                    let i = 0;
                    i < 40;
                    i++
                ) {

                    setTimeout(
                        () => {

                            createHeart();

                        },
                        i * 80
                    );

                }


                /* Hide celebration */

                setTimeout(
                    () => {

                        celebrate.classList.remove(
                            "show"
                        );

                    },
                    4000
                );

            }
        );



        noBtn.addEventListener(
            "click",
            () => {

                message.innerHTML =
                    "Please Diuu 🥺 Don't be angry with me ❤️";


                const maxX =
                    window.innerWidth -
                    noBtn.offsetWidth -
                    10;


                const maxY =
                    window.innerHeight -
                    noBtn.offsetHeight -
                    10;


                const x =
                    Math.max(
                        10,
                        Math.random() * maxX
                    );


                const y =
                    Math.max(
                        10,
                        Math.random() * maxY
                    );


                noBtn.style.position =
                    "fixed";

                noBtn.style.left =
                    x + "px";

                noBtn.style.top =
                    y + "px";

            }
        );


 

        function createHeart() {

            const heart =
                document.createElement(
                    "div"
                );


            heart.classList.add(
                "floating-heart"
            );


            const hearts = [

                "❤️",
                "💗",
                "💕",
                "💖",
                "💘",
                "🥰",
                "💓",
                "💞"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 +
                "vw";


            heart.style.fontSize =
                (
                    15 +
                    Math.random() * 30
                ) + "px";


            heart.style.animationDuration =
                (
                    3 +
                    Math.random() * 4
                ) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                () => {

                    heart.remove();

                },
                7000
            );

        }



    

        setInterval(
            () => {

                if (
                    !opening.classList.contains(
                        "hide"
                    )
                ) {

                    return;

                }

                createHeart();

            },
            700
        );

    </script>

</body>

</html>
